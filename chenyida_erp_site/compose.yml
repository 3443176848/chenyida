name: chenyida-erp

x-release-build-args: &release-build-args
  ERP_BUILD_VERSION: ${ERP_BUILD_VERSION:-}
  ERP_BUILD_REVISION: ${ERP_BUILD_REVISION:-}

x-app-environment: &app-environment
  ERP_ENV: production
  ERP_PUBLIC_ORIGIN: ${ERP_PUBLIC_ORIGIN:-}
  ERP_DEPLOYMENT_CLASS: ${ERP_DEPLOYMENT_CLASS:?ERP_DEPLOYMENT_CLASS must be uat or production}
  ERP_UAT_ALLOW_LOOPBACK_ORIGIN: ${ERP_UAT_ALLOW_LOOPBACK_ORIGIN:-false}
  ERP_UPLOAD_ROOT: /data/chenyida-erp/uploads
  ERP_ATTACHMENT_ROOT: /data/chenyida-erp/attachments
  ERP_BACKUP_STATUS_FILE: /data/chenyida-erp/backup-status/recovery-readiness.json
  ERP_RELEASE_EXPECTED_DEPLOYMENT_ID: ${ERP_RELEASE_EXPECTED_DEPLOYMENT_ID:?ERP_RELEASE_EXPECTED_DEPLOYMENT_ID is required}
  ERP_RELEASE_EXPECTED_VERSION: ${ERP_RELEASE_EXPECTED_VERSION:-}
  ERP_RELEASE_EXPECTED_GIT_COMMIT: ${ERP_RELEASE_EXPECTED_GIT_COMMIT:-}
  ERP_RELEASE_EXPECTED_MANIFEST_SHA256: ${ERP_RELEASE_EXPECTED_MANIFEST_SHA256:-}
  ERP_RELEASE_EXPECTED_SUPERVISOR_BUNDLE_SHA256: ${ERP_RELEASE_EXPECTED_SUPERVISOR_BUNDLE_SHA256:-}
  ERP_RELEASE_IDENTITY_MAX_AGE_SECONDS: ${ERP_RELEASE_IDENTITY_MAX_AGE_SECONDS:-}
  ERP_BACKUP_POLICY_ID: ${ERP_BACKUP_POLICY_ID:-}
  ERP_BACKUP_RPO_HOURS: ${ERP_BACKUP_RPO_HOURS:-}
  ERP_BACKUP_OPERATIONS_POLICY_ID: ${ERP_BACKUP_OPERATIONS_POLICY_ID:-}
  ERP_BACKUP_OPERATIONS_POLICY_SHA256: ${ERP_BACKUP_OPERATIONS_POLICY_SHA256:-}
  ERP_BACKUP_OPERATIONS_POLICY_SCOPE: ${ERP_BACKUP_OPERATIONS_POLICY_SCOPE:-}
  ERP_BACKUP_EXPECTED_OFFHOST_LOCATION_ID: ${ERP_BACKUP_EXPECTED_OFFHOST_LOCATION_ID:-}
  ERP_BACKUP_EXPECTED_OFFHOST_RECEIVER_IDENTITY_SHA256: ${ERP_BACKUP_EXPECTED_OFFHOST_RECEIVER_IDENTITY_SHA256:-}
  ERP_BACKUP_EXPECTED_RESTORE_LOCATION_ID: ${ERP_BACKUP_EXPECTED_RESTORE_LOCATION_ID:-}
  ERP_BACKUP_EXPECTED_RESTORE_TARGET_ID: ${ERP_BACKUP_EXPECTED_RESTORE_TARGET_ID:-}
  ERP_BACKUP_EXPECTED_RESTORE_TARGET_SYSTEM_IDENTIFIER: ${ERP_BACKUP_EXPECTED_RESTORE_TARGET_SYSTEM_IDENTIFIER:-}
  ERP_BACKUP_EXPECTED_RESTORE_TARGET_CLUSTER_MARKER_ID: ${ERP_BACKUP_EXPECTED_RESTORE_TARGET_CLUSTER_MARKER_ID:-}
  ERP_BACKUP_EVIDENCE_TRUST_MODE: ${ERP_BACKUP_EVIDENCE_TRUST_MODE:-}
  ERP_MAX_UPLOAD_BYTES: ${ERP_MAX_UPLOAD_BYTES:-10485760}
  ERP_WORKER_POLL_MS: ${ERP_WORKER_POLL_MS:-1000}
  ERP_WORKER_LEASE_SECONDS: ${ERP_WORKER_LEASE_SECONDS:-60}

x-app-volumes: &app-volumes
  - type: volume
    source: erp_uploads
    target: /data/chenyida-erp/uploads
  - type: volume
    source: erp_attachments
    target: /data/chenyida-erp/attachments
  - type: bind
    source: /etc/chenyida-erp/runtime-secrets/worker-database-password
    target: /run/chenyida-erp-secrets/worker-database-password
    read_only: true
    bind:
      create_host_path: false

services:
  postgres:
    image: postgres@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "0.75"
    mem_limit: 768m
    memswap_limit: 1g
    pids_limit: 128
    shm_size: 64m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
      - /run/chenyida-erp-secrets:rw,nosuid,nodev,noexec,size=1m,uid=0,gid=0,mode=0555
      - /var/run/postgresql:rw,nosuid,nodev,noexec,size=16m,uid=999,gid=999,mode=3775
    environment:
      POSTGRES_DB: chenyida_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/chenyida-erp-secrets/postgres-bootstrap-password
    volumes:
      - type: volume
        source: erp_postgres
        target: /var/lib/postgresql/data
      - type: volume
        source: erp_postgres_tablespaces
        target: /var/lib/postgresql/tablespaces
      - type: bind
        source: /etc/chenyida-erp/runtime-secrets/postgres-bootstrap-password
        target: /run/chenyida-erp-secrets/postgres-bootstrap-password
        read_only: true
        bind:
          create_host_path: false
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: "10m", max-file: "5" }

  migrate:
    build: { context: ., target: worker, args: *release-build-args }
    user: "65532:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "0.75"
    mem_limit: 768m
    memswap_limit: 1g
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    command: ["node", "--experimental-strip-types", "scripts/migrate-postgres.ts"]
    environment:
      <<: *app-environment
      ERP_SERVICE_KIND: MIGRATION
      ERP_ALLOW_PRODUCTION_MIGRATION: ${ERP_ALLOW_PRODUCTION_MIGRATION:-}
      ERP_RELEASE_MANIFEST_FILE: /run/chenyida-erp-release-candidate/release-manifest.json
      ERP_RELEASE_MANIFEST_SHA256: ${ERP_RELEASE_MANIFEST_SHA256:-}
      ERP_MIGRATION_CONFIRM: ${ERP_MIGRATION_CONFIRM:-}
      ERP_MIGRATION_EXPECTED_DATABASE: chenyida_erp
      ERP_MIGRATION_EXPECTED_SYSTEM_IDENTIFIER: ${ERP_MIGRATION_EXPECTED_SYSTEM_IDENTIFIER:-}
      ERP_MIGRATION_EXPECTED_DATABASE_OID: ${ERP_MIGRATION_EXPECTED_DATABASE_OID:-}
      ERP_MIGRATION_EXPECTED_DATABASE_MARKER: ${ERP_MIGRATION_EXPECTED_DATABASE_MARKER:-}
      ERP_MIGRATION_EXPECTED_ROLE: chenyida_erp_owner
      ERP_MIGRATION_EXPECTED_CURRENT_HEAD: ${ERP_MIGRATION_EXPECTED_CURRENT_HEAD:-}
      ERP_MIGRATION_EXPECTED_TARGET_HEAD: ${ERP_MIGRATION_EXPECTED_TARGET_HEAD:-}
    volumes:
      - type: bind
        source: /var/lib/chenyida-erp/release-candidate
        target: /run/chenyida-erp-release-candidate
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/chenyida-erp/runtime-secrets/migration-database-password
        target: /run/chenyida-erp-secrets/migration-database-password
        read_only: true
        bind:
          create_host_path: false
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging:
      driver: local
      options: { max-size: "10m", max-file: "2" }

  web:
    build: { context: ., target: web, args: *release-build-args }
    user: "65532:65532"
    group_add: ["${ERP_RELEASE_IDENTITY_READER_GID:?ERP_RELEASE_IDENTITY_READER_GID is required}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "0.75"
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    environment:
      <<: *app-environment
      ERP_SERVICE_KIND: WEB
      ERP_PROCESS_NAME: chenyida-erp-web
      NODE_OPTIONS: --max-old-space-size=384
      PORT: 3000
    volumes:
      - type: volume
        source: erp_uploads
        target: /data/chenyida-erp/uploads
      - type: volume
        source: erp_attachments
        target: /data/chenyida-erp/attachments
      - type: volume
        source: erp_backup_status
        target: /data/chenyida-erp/backup-status
        read_only: true
      - type: bind
        source: /var/lib/chenyida-erp/release-identity
        target: /run/chenyida-erp-release
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/chenyida-erp/runtime-secrets/web-database-password
        target: /run/chenyida-erp-secrets/web-database-password
        read_only: true
        bind:
          create_host_path: false
    networks: [backend, edge]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "127.0.0.1:${ERP_HTTP_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    logging:
      driver: local
      options: { max-size: "10m", max-file: "5" }

  worker:
    build: { context: ., target: worker, args: *release-build-args }
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "0.50"
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    environment:
      <<: *app-environment
      ERP_SERVICE_KIND: WORKER
      ERP_PROCESS_NAME: chenyida-erp-worker
      ERP_WORKER_INSTANCE_FILE: /tmp/chenyida-erp-worker-instance-id
      NODE_OPTIONS: --max-old-space-size=384
    volumes: *app-volumes
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "--experimental-strip-types", "scripts/worker-readiness-check.ts"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: local
      options: { max-size: "10m", max-file: "5" }

  admin:
    build: { context: ., target: worker, args: *release-build-args }
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "0.50"
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    command: ["node", "--experimental-strip-types", "scripts/init-admin.ts"]
    environment:
      <<: *app-environment
      ERP_SERVICE_KIND: ADMIN
      ERP_ADMIN_USERNAME: ${ERP_ADMIN_USERNAME:-}
      ERP_ADMIN_DISPLAY_NAME: ${ERP_ADMIN_DISPLAY_NAME:-}
    volumes:
      - type: bind
        source: /etc/chenyida-erp/runtime-secrets/admin-database-password
        target: /run/chenyida-erp-secrets/admin-database-password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/chenyida-erp/runtime-secrets/admin-password
        target: /run/chenyida-erp-secrets/admin-password
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    profiles: ["tools"]
    restart: "no"
    logging:
      driver: local
      options: { max-size: "10m", max-file: "2" }

  caddy:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    cpus: "0.25"
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 64
    environment:
      ERP_DOMAIN: ${ERP_DOMAIN:-erp.invalid}
      ERP_HTTPS_PORT: 443
    volumes:
      - type: bind
        source: ./deploy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    ports:
      - "0.0.0.0:${ERP_PUBLIC_HTTP_PORT:-80}:80"
      - "0.0.0.0:${ERP_PUBLIC_HTTPS_PORT:-443}:443"
      - "0.0.0.0:${ERP_PUBLIC_HTTPS_PORT:-443}:443/udp"
    depends_on:
      web: { condition: service_healthy }
    profiles: ["production"]
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: "10m", max-file: "5" }

networks:
  backend:
    internal: true
  edge:

volumes:
  erp_postgres:
  erp_postgres_tablespaces:
  erp_uploads:
  erp_attachments:
  erp_backup_status:
  caddy_data:
  caddy_config:
