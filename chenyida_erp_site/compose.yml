name: chenyida-erp

x-release-build-args: &release-build-args
  ERP_BUILD_VERSION: ${ERP_BUILD_VERSION:-}
  ERP_BUILD_REVISION: ${ERP_BUILD_REVISION:-}

x-app-environment: &app-environment
  ERP_ENV: ${ERP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  ERP_SETUP_TOKEN: ${ERP_SETUP_TOKEN:?ERP_SETUP_TOKEN is required}
  ERP_PUBLIC_ORIGIN: ${ERP_PUBLIC_ORIGIN:-}
  ERP_DEPLOYMENT_CLASS: ${ERP_DEPLOYMENT_CLASS:-}
  ERP_UAT_ALLOW_LOOPBACK_ORIGIN: ${ERP_UAT_ALLOW_LOOPBACK_ORIGIN:-false}
  ERP_UPLOAD_ROOT: /data/chenyida-erp/uploads
  ERP_ATTACHMENT_ROOT: /data/chenyida-erp/attachments
  ERP_BACKUP_STATUS_FILE: /data/chenyida-erp/backup-status/latest.json
  ERP_RELEASE_EXPECTED_DEPLOYMENT_ID: ${ERP_RELEASE_EXPECTED_DEPLOYMENT_ID:-}
  ERP_RELEASE_EXPECTED_VERSION: ${ERP_RELEASE_EXPECTED_VERSION:-}
  ERP_RELEASE_EXPECTED_GIT_COMMIT: ${ERP_RELEASE_EXPECTED_GIT_COMMIT:-}
  ERP_RELEASE_EXPECTED_MANIFEST_SHA256: ${ERP_RELEASE_EXPECTED_MANIFEST_SHA256:-}
  ERP_RELEASE_EXPECTED_SUPERVISOR_BUNDLE_SHA256: ${ERP_RELEASE_EXPECTED_SUPERVISOR_BUNDLE_SHA256:-}
  ERP_RELEASE_IDENTITY_MAX_AGE_SECONDS: ${ERP_RELEASE_IDENTITY_MAX_AGE_SECONDS:-}
  ERP_BACKUP_POLICY_ID: ${ERP_BACKUP_POLICY_ID:-}
  ERP_BACKUP_RPO_HOURS: ${ERP_BACKUP_RPO_HOURS:-}
  ERP_BACKUP_EXPECTED_OFFHOST_LOCATION_ID: ${ERP_BACKUP_EXPECTED_OFFHOST_LOCATION_ID:-}
  ERP_BACKUP_EXPECTED_OFFHOST_RECEIVER_IDENTITY_SHA256: ${ERP_BACKUP_EXPECTED_OFFHOST_RECEIVER_IDENTITY_SHA256:-}
  ERP_BACKUP_EXPECTED_RESTORE_LOCATION_ID: ${ERP_BACKUP_EXPECTED_RESTORE_LOCATION_ID:-}
  ERP_BACKUP_EXPECTED_RESTORE_TARGET_ID: ${ERP_BACKUP_EXPECTED_RESTORE_TARGET_ID:-}
  ERP_BACKUP_EXPECTED_RESTORE_TARGET_SYSTEM_IDENTIFIER: ${ERP_BACKUP_EXPECTED_RESTORE_TARGET_SYSTEM_IDENTIFIER:-}
  ERP_BACKUP_EXPECTED_RESTORE_TARGET_CLUSTER_MARKER_ID: ${ERP_BACKUP_EXPECTED_RESTORE_TARGET_CLUSTER_MARKER_ID:-}
  ERP_BACKUP_EVIDENCE_TRUST_MODE: ${ERP_BACKUP_EVIDENCE_TRUST_MODE:-}
  ERP_MAX_UPLOAD_BYTES: ${ERP_MAX_UPLOAD_BYTES:-10485760}
  ERP_WORKER_POLL_MS: ${ERP_WORKER_POLL_MS:-1000}
  ERP_WORKER_LEASE_SECONDS: ${ERP_WORKER_LEASE_SECONDS:-60}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}

x-app-volumes: &app-volumes
  - erp_uploads:/data/chenyida-erp/uploads
  - erp_attachments:/data/chenyida-erp/attachments

services:
  postgres:
    image: postgres:17-bookworm
    cpus: "0.75"
    mem_limit: 768m
    memswap_limit: 1g
    pids_limit: 128
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - erp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "5" }

  migrate:
    build: { context: ., target: worker, args: *release-build-args }
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "0.75"
    mem_limit: 768m
    memswap_limit: 1g
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    command: ["node", "--experimental-strip-types", "scripts/migrate-postgres.ts"]
    environment:
      <<: *app-environment
      DATABASE_URL: ${ERP_MIGRATION_DATABASE_URL:?ERP_MIGRATION_DATABASE_URL is required}
      ERP_ALLOW_PRODUCTION_MIGRATION: ${ERP_ALLOW_PRODUCTION_MIGRATION:-}
      ERP_RELEASE_MANIFEST_FILE: /run/chenyida-erp-release-candidate/release-manifest.json
      ERP_RELEASE_MANIFEST_SHA256: ${ERP_RELEASE_MANIFEST_SHA256:-}
      ERP_MIGRATION_CONFIRM: ${ERP_MIGRATION_CONFIRM:-}
      ERP_MIGRATION_EXPECTED_DATABASE: ${ERP_MIGRATION_EXPECTED_DATABASE:-}
      ERP_MIGRATION_EXPECTED_SYSTEM_IDENTIFIER: ${ERP_MIGRATION_EXPECTED_SYSTEM_IDENTIFIER:-}
      ERP_MIGRATION_EXPECTED_DATABASE_OID: ${ERP_MIGRATION_EXPECTED_DATABASE_OID:-}
      ERP_MIGRATION_EXPECTED_DATABASE_MARKER: ${ERP_MIGRATION_EXPECTED_DATABASE_MARKER:-}
      ERP_MIGRATION_EXPECTED_ROLE: ${ERP_MIGRATION_EXPECTED_ROLE:-}
      ERP_MIGRATION_EXPECTED_CURRENT_HEAD: ${ERP_MIGRATION_EXPECTED_CURRENT_HEAD:-}
      ERP_MIGRATION_EXPECTED_TARGET_HEAD: ${ERP_MIGRATION_EXPECTED_TARGET_HEAD:-}
    volumes:
      - type: bind
        source: ${ERP_RELEASE_ARTIFACT_HOST_ROOT:-/var/lib/chenyida-erp/release-candidate}
        target: /run/chenyida-erp-release-candidate
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web, args: *release-build-args }
    cpus: "0.75"
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 128
    environment:
      <<: *app-environment
      ERP_PROCESS_NAME: chenyida-erp-web
      NODE_OPTIONS: --max-old-space-size=384
      PORT: 3000
    volumes:
      - erp_uploads:/data/chenyida-erp/uploads
      - erp_attachments:/data/chenyida-erp/attachments
      - erp_backup_status:/data/chenyida-erp/backup-status:ro
      - ${ERP_RELEASE_IDENTITY_HOST_ROOT:-/var/lib/chenyida-erp/release-identity}:/run/chenyida-erp-release:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "${ERP_HTTP_BIND:-127.0.0.1}:${ERP_HTTP_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    logging:
      options: { max-size: "10m", max-file: "5" }

  worker:
    build: { context: ., target: worker, args: *release-build-args }
    cpus: "0.50"
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 128
    environment:
      <<: *app-environment
      ERP_PROCESS_NAME: chenyida-erp-worker
      NODE_OPTIONS: --max-old-space-size=384
    volumes: *app-volumes
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      options: { max-size: "10m", max-file: "5" }

  admin:
    build: { context: ., target: worker, args: *release-build-args }
    cpus: "0.50"
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 128
    command: ["node", "--experimental-strip-types", "scripts/init-admin.ts"]
    environment:
      <<: *app-environment
      ERP_ADMIN_USERNAME: ${ERP_ADMIN_USERNAME:-}
      ERP_ADMIN_DISPLAY_NAME: ${ERP_ADMIN_DISPLAY_NAME:-}
      ERP_ADMIN_PASSWORD: ${ERP_ADMIN_PASSWORD:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    profiles: ["tools"]
    restart: "no"

  caddy:
    image: caddy:2.10-alpine
    cpus: "0.25"
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 64
    environment:
      ERP_DOMAIN: ${ERP_DOMAIN:-erp.invalid}
      ERP_HTTPS_PORT: ${ERP_HTTPS_PORT:-443}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${ERP_PUBLIC_HTTP_BIND:-0.0.0.0}:${ERP_PUBLIC_HTTP_PORT:-80}:80"
      - "${ERP_PUBLIC_HTTPS_BIND:-0.0.0.0}:${ERP_PUBLIC_HTTPS_PORT:-443}:${ERP_HTTPS_PORT:-443}"
      - "${ERP_PUBLIC_HTTPS_BIND:-0.0.0.0}:${ERP_PUBLIC_HTTPS_PORT:-443}:${ERP_HTTPS_PORT:-443}/udp"
    depends_on:
      web: { condition: service_healthy }
    profiles: ["production"]
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "5" }

volumes:
  erp_postgres:
  erp_uploads:
  erp_attachments:
  erp_backup_status:
  caddy_data:
  caddy_config:
